<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f1e6"/>
      <stop offset="100%" stop-color="#ede5d8"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#a67c52" flood-opacity="0.12"/></filter>
    <filter id="sh2"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#a67c52" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- Browser window -->
  <rect x="48" y="18" width="704" height="384" rx="14" fill="white" filter="url(#sh)"/>

  <!-- Title bar -->
  <rect x="48" y="18" width="704" height="40" rx="14" fill="#f0ebe0"/>
  <rect x="48" y="44" width="704" height="14" fill="#f0ebe0"/>
  <circle cx="72" cy="38" r="5.5" fill="#ff5f57"/>
  <circle cx="90" cy="38" r="5.5" fill="#febc2e"/>
  <circle cx="108" cy="38" r="5.5" fill="#28c840"/>
  <rect x="200" y="28" width="260" height="20" rx="10" fill="white" opacity="0.7"/>
  <text x="330" y="42" text-anchor="middle" font-family="system-ui" font-size="10" fill="#a67c52">mindease.app/chat</text>

  <!-- Chat header -->
  <rect x="48" y="58" width="704" height="50" fill="#faf7f2"/>
  <rect x="48" y="107" width="704" height="1" fill="#ede5d8"/>
  <circle cx="80" cy="83" r="14" fill="#a67c52"/>
  <text x="80" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="white" font-weight="bold">M</text>
  <text x="104" y="79" font-family="system-ui" font-size="11" fill="#4a3f35" font-weight="600">MindEase AI</text>
  <circle cx="104" cy="92" r="3.5" fill="#5D8A6B"/>
  <text x="112" y="96" font-family="system-ui" font-size="9" fill="#5D8A6B">Online</text>

  <!-- Emotion bar at top right of header -->
  <text x="520" y="77" font-family="system-ui" font-size="8.5" fill="#7d6b56" font-weight="600" letter-spacing="0.06em">MOOD DETECTED</text>
  <rect x="520" y="84" width="210" height="12" rx="6" fill="#ede5d8"/>
  <rect x="520" y="84" width="126" height="12" rx="6" fill="#a67c52" opacity="0.7"/>
  <circle cx="646" cy="90" r="9" fill="#a67c52"/>
  <text x="646" y="94" text-anchor="middle" font-family="system-ui" font-size="8" fill="white" font-weight="700">60%</text>
  <text x="732" y="97" text-anchor="end" font-family="system-ui" font-size="8" fill="#c5bcac">Anxious</text>

  <!-- Message 1: AI -->
  <circle cx="70" cy="146" r="13" fill="#a67c52"/>
  <text x="70" y="151" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="white" font-weight="bold">M</text>
  <rect x="92" y="128" width="260" height="42" rx="14" fill="#f5f1e6" stroke="#ede5d8" stroke-width="1"/>
  <rect x="108" y="140" width="200" height="8" rx="4" fill="#7d6b56"/>
  <rect x="108" y="153" width="155" height="7" rx="3.5" fill="#c5bcac"/>

  <!-- Emotion chip on message 1 -->
  <rect x="362" y="132" width="110" height="32" rx="16" fill="#fdf3ec" stroke="#dbd0ba" stroke-width="1.5" filter="url(#sh2)"/>
  <circle cx="382" cy="148" r="7" fill="#f59e0b"/>
  <text x="395" y="152" font-family="system-ui" font-size="9.5" fill="#a67c52" font-weight="700">Anxious</text>

  <!-- Message 2: User -->
  <rect x="360" y="184" width="340" height="40" rx="14" fill="#a67c52"/>
  <rect x="376" y="196" width="240" height="8" rx="4" fill="white" opacity="0.8"/>
  <rect x="376" y="208" width="170" height="7" rx="3.5" fill="white" opacity="0.5"/>

  <!-- Message 3: AI -->
  <circle cx="70" cy="256" r="13" fill="#a67c52"/>
  <text x="70" y="261" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="white" font-weight="bold">M</text>
  <rect x="92" y="238" width="290" height="52" rx="14" fill="#f5f1e6" stroke="#ede5d8" stroke-width="1"/>
  <rect x="108" y="250" width="230" height="8" rx="4" fill="#7d6b56"/>
  <rect x="108" y="262" width="200" height="7" rx="3.5" fill="#c5bcac"/>
  <rect x="108" y="273" width="150" height="7" rx="3.5" fill="#c5bcac"/>

  <!-- Emotion chip on message 3 — shifted to Reflective -->
  <rect x="392" y="246" width="122" height="32" rx="16" fill="#eef4f0" stroke="#c5d8cc" stroke-width="1.5" filter="url(#sh2)"/>
  <circle cx="412" cy="262" r="7" fill="#5D8A6B"/>
  <text x="426" y="266" font-family="system-ui" font-size="9.5" fill="#4a7358" font-weight="700">Reflective</text>

  <!-- Message 4: User -->
  <rect x="400" y="304" width="296" height="40" rx="14" fill="#a67c52"/>
  <rect x="416" y="316" width="210" height="8" rx="4" fill="white" opacity="0.8"/>
  <rect x="416" y="328" width="140" height="7" rx="3.5" fill="white" opacity="0.5"/>

  <!-- Emotion progression footer -->
  <rect x="48" y="358" width="704" height="44" fill="#faf7f2"/>
  <rect x="48" y="358" width="704" height="1" fill="#ede5d8"/>
  <text x="68" y="376" font-family="system-ui" font-size="8.5" fill="#7d6b56" font-weight="700" letter-spacing="0.06em">EMOTIONAL ARC</text>
  <!-- Nodes -->
  <circle cx="180" cy="381" r="7" fill="#f59e0b"/>
  <text x="180" y="398" text-anchor="middle" font-family="system-ui" font-size="8" fill="#a67c52">Anxious</text>
  <line x1="187" y1="381" x2="263" y2="381" stroke="#dbd0ba" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="270" cy="381" r="7" fill="#c0956b"/>
  <text x="270" y="398" text-anchor="middle" font-family="system-ui" font-size="8" fill="#7d6b56">Sad</text>
  <line x1="277" y1="381" x2="353" y2="381" stroke="#dbd0ba" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="360" cy="381" r="7" fill="#5D8A6B"/>
  <text x="360" y="398" text-anchor="middle" font-family="system-ui" font-size="8" fill="#5D8A6B">Calm</text>
  <line x1="367" y1="381" x2="443" y2="381" stroke="#dbd0ba" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="450" cy="381" r="9" fill="#4a7358" stroke="white" stroke-width="2"/>
  <text x="450" y="398" text-anchor="middle" font-family="system-ui" font-size="8" fill="#4a7358" font-weight="700">Hopeful</text>
</svg>
